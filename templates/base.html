{% load static %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Mi Sistema{% endblock %}</title>

    <!-- Bootstrap 5.3 CSS (vía CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Iconos de Bootstrap (muy útiles para el menú) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Tu CSS personalizado del Sidebar -->
    <link href="{% static 'css/sidebars.css' %}" rel="stylesheet">
    
    {% block extra_css %}{% endblock %}
</head>
<body>

<main class="d-flex flex-nowrap">
    
    <!-- BARRA LATERAL (SIDEBAR) -->
    <div class="d-flex flex-column flex-shrink-0 p-3 text-bg-dark" style="width: 280px;">
        <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
            <i class="bi bi-layers fs-4 me-2"></i>
            <span class="fs-4">Mi Proyecto</span>
        </a>
        <hr>
        
        <!-- Enlaces de navegación -->
        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item">
                <a href="#" class="nav-link active" aria-current="page">
                    <i class="bi bi-house-door me-2"></i>
                    Inicio
                </a>
            </li>
            <li>
                <a href="#" class="nav-link text-white">
                    <i class="bi bi-speedometer2 me-2"></i>
                    Panel General
                </a>
            </li>
            <li>
                <a href="#" class="nav-link text-white">
                    <i class="bi bi-table me-2"></i>
                    Registros
                </a>
            </li>
        </ul>
        <hr>
        
        <!-- Menú desplegable del usuario abajo -->
        <div class="dropdown">
            <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-person-circle fs-4 me-2"></i>
                <strong>Usuario</strong>
            </a>
            <ul class="dropdown-menu dropdown-menu-dark text-small shadow">
                <li><a class="dropdown-item" href="#">Perfil</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item" href="#">Cerrar sesión</a></li>
            </ul>
        </div>
    </div>

    <!-- ÁREA DE CONTENIDO PRINCIPAL (Aquí irá cada página hija) -->
    <div class="flex-grow-1 p-4 overflow-auto">
        {% block content %}
        <!-- El contenido de tus otras páginas aparecerá aquí -->
        {% endblock %}
    </div>

</main>

<!-- Bootstrap 5.3 JS Bundle (incluye Popper para los dropdowns) -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Tu JS personalizado del Sidebar -->
<script src="{% static 'js/sidebars.js' %}"></script>


{% block extra_js %}{% endblock %}
</body>
</html>
