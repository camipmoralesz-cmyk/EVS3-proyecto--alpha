<!doctype html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>403 · Acceso denegado | FYAG</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #121417; min-height: 100vh; display: grid; place-items: center; padding: 1rem; }
        .caja-403 { max-width: 30rem; background-color: #1a1d21; border: 1px solid #2b3035; border-top: 3px solid #dc3545; border-radius: 0.75rem; }
    </style>
</head>
<body>
    <main class="caja-403 p-4 text-center shadow">
        <div class="text-danger fw-bold small text-uppercase mb-1">Error HTTP 403</div>
        <h1 class="h3 fw-bold text-white mb-3"><i class="bi bi-shield-lock me-2 text-info"></i>Acceso denegado</h1>
        <p class="alert alert-danger small mb-4">
            No tienes permisos suficientes para acceder a este módulo. Si crees que es un error, solicita al Administrador General que revise tu rol.
        </p>
        <div class="d-grid gap-2">
            <a href="{% url 'usuarios:login_por_rol' %}" class="btn btn-primary fw-semibold">
                <i class="bi bi-house-door me-1"></i> Volver a mi panel
            </a>
            <a href="{% url 'usuarios:inicio' %}" class="btn btn-outline-info btn-sm">
                <i class="bi bi-person-badge me-1"></i> Ver mi cuenta y roles
            </a>
        </div>
    </main>
</body>
</html>
