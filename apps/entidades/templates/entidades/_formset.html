<div class="card card-custom mb-4" data-formset-prefix="{{ formset.prefix }}">
    <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
        <h5 class="card-title mb-0 fw-semibold text-primary">
            <i class="bi {{ icono }} me-2"></i> {{ titulo }}
        </h5>
        <button type="button" class="btn btn-outline-primary btn-sm" data-add-formset="{{ formset.prefix }}">
            <i class="bi bi-plus-circle me-1"></i> {{ texto_boton }}
        </button>
    </div>
    <div class="card-body">
        {{ formset.management_form }}

        {% if formset.non_form_errors %}
            <div class="alert alert-danger py-2 small">
                {{ formset.non_form_errors }}
            </div>
        {% endif %}

        <div id="formset-container-{{ formset.prefix }}">
            {% for subform in formset.forms %}
                {% include "entidades/_formset_row.html" with subform=subform %}
            {% endfor %}
        </div>

        <template id="empty-form-{{ formset.prefix }}">
            {% include "entidades/_formset_row.html" with subform=formset.empty_form %}
        </template>
    </div>
</div>
